name: Build and Release

# Releases are cut by pushing a semver tag (e.g. v1.2.0): CI publishes a signed Velopack
# release to GitHub Releases, and installed apps auto-update from it. Pull requests build
# and pack (unsigned, no upload) to validate the pipeline.
on:
  push:
    # Branch pushes run validate only, so a bad commit is caught when it lands rather than
    # at the next tag - by which point the tag is already on the remote and the release is
    # half-cut. Tag pushes still run the full signed release path.
    branches: [ "main" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

# --- Required repository configuration (Settings -> Secrets and variables -> Actions) ---
# Variables (not secrets - OIDC means no signing secret to store):
#   AZURE_CLIENT_ID        Entra app (federated credential) client id
#   AZURE_TENANT_ID        Entra tenant id
#   AZURE_SUBSCRIPTION_ID  subscription holding the Trusted Signing account
#   AZURE_SIGN_ENDPOINT    abbreviated-region host, e.g. https://eus.codesigning.azure.net (East US)
#   AZURE_SIGN_ACCOUNT     Trusted Signing account name
#   AZURE_SIGN_PROFILE     certificate profile name
# The Entra app needs the "Trusted Signing Certificate Profile Signer" role on the account,
# and a federated credential scoped to: repo:${{ github.repository }}:ref:refs/tags/v*

jobs:
  validate:
    runs-on: windows-latest
    permissions:
      contents: read
    env:
      # Directory.Build.props only promotes warnings to errors when this is set, so before this
      # the documented "warnings are red" policy was never actually enforced in CI: analyzer
      # warnings accumulated as log noise and could only be caught by a developer who ran the
      # strict build by hand.
      GloamStrictBuild: 'true'

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/Gloam.sln

      - name: Test
        run: dotnet test src/Gloam.sln --configuration Release --no-restore

      - name: Headless CLI LUT check
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          dotnet run --project src/Gloam.Cli/Gloam.Cli.csproj --configuration Release --no-restore -- check-lut 2.2 200 --algorithm perceptual --temp-k 2700 --json artifacts/cli-lut-check.json

      - name: Vulnerability scan
        shell: pwsh
        run: |
          # `dotnet list package` has no --fail-on-vulnerable in this SDK, so it exits 0 whether or
          # not advisories are found and the scan was effectively a log line. Parse the JSON report
          # and fail the job on any advisory instead.
          $json = dotnet list src/Gloam.sln package --vulnerable --include-transitive --format json
          if ($LASTEXITCODE -ne 0) { throw "dotnet list package exited $LASTEXITCODE." }

          $findings = @(
            foreach ($project in ($json | ConvertFrom-Json).projects) {
              foreach ($framework in $project.frameworks) {
                foreach ($package in @($framework.topLevelPackages) + @($framework.transitivePackages)) {
                  if ($null -eq $package) { continue }
                  foreach ($advisory in $package.vulnerabilities) {
                    "$($project.path): $($package.id) $($package.resolvedVersion) " +
                      "[$($advisory.severity)] $($advisory.advisoryurl)"
                  }
                }
              }
            }
          )

          if ($findings.Count -gt 0) {
            $findings | ForEach-Object { Write-Host "  $_" }
            throw "$($findings.Count) known vulnerable package(s) found."
          }
          Write-Host "No known vulnerable packages."

      - name: Update feed consistency
        shell: pwsh
        run: ./scripts/Test-UpdateFeedConsistency.ps1

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Gloam_Validation
          path: artifacts/*
          if-no-files-found: ignore

  build:
    runs-on: windows-latest
    needs: validate
    permissions:
      contents: write   # publish GitHub Releases
      id-token: write   # OIDC token for azure/login (no client secret stored)
    # Tag builds run in the 'release' GitHub Environment so the OIDC token subject is
    # exactly repo:<github.repository>:environment:release - for this fork that is
    # repo:mentho7/gloam-cn:environment:release, matching the Azure federated credential.
    # The credential matches the subject exactly and cannot wildcard a tag ref like
    # refs/tags/v*. Non-tag runs (PR/dispatch) resolve to an empty name, i.e. no environment.
    environment: ${{ startsWith(github.ref, 'refs/tags/v') && 'release' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Derive version
        id: ver
        shell: pwsh
        run: |
          $ref = "${{ github.ref }}"
          if ($ref -like 'refs/tags/v*') {
            $v = "${{ github.ref_name }}" -replace '^v',''
            if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
              throw "Release tag '${{ github.ref_name }}' must be semver: vX.Y.Z or vX.Y.Z-prerelease"
            }
          } else {
            # Non-release build (PR / manual): synthetic but valid semver.
            $v = "0.0.${{ github.run_number }}"
          }
          Write-Host "version=$v"
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Publish + bundle assets
        shell: pwsh
        run: ./package.ps1 -Version ${{ steps.ver.outputs.version }} -PublishOnly

      - name: Install Velopack CLI
        run: dotnet tool install -g vpk --version 1.2.161

      # --- Release-only steps (tags) ---

      - name: Azure login (OIDC)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: azure/login@v3
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Write Azure signing metadata
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          @{
            Endpoint               = "${{ vars.AZURE_SIGN_ENDPOINT }}"
            CodeSigningAccountName = "${{ vars.AZURE_SIGN_ACCOUNT }}"
            CertificateProfileName = "${{ vars.AZURE_SIGN_PROFILE }}"
          } | ConvertTo-Json | Set-Content azure-sign.json

      - name: Download previous release (enables deltas)
        if: startsWith(github.ref, 'refs/tags/v')
        run: vpk download github --repoUrl https://github.com/${{ github.repository }} --token ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true   # first release has nothing to download

      # packId is "GloamApp" (not "Gloam") so Velopack's install root (%LocalAppData%\GloamApp,
      # which uninstall deletes wholesale) stays off the app's data dir (%LocalAppData%\Gloam).
      # User-facing name is the packTitle. Keep this id identical to package.ps1.
      - name: Pack (signed)
        if: startsWith(github.ref, 'refs/tags/v')
        run: >
          vpk pack
          --packId GloamApp
          --packVersion ${{ steps.ver.outputs.version }}
          --packDir publish
          --mainExe Gloam.exe
          --packTitle Gloam
          --packAuthors "mentho7"
          --icon src/Gloam/app.ico
          --azureTrustedSignFile azure-sign.json

      - name: Verify signed release artifacts
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: ./scripts/Test-SignedReleaseArtifacts.ps1 -ReleaseDir Releases -Version ${{ steps.ver.outputs.version }}

      - name: Upload to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        run: >
          vpk upload github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --publish
          --releaseName "Gloam ${{ steps.ver.outputs.version }}"
          --tag ${{ github.ref_name }}
          --merge

      # --- Validation-only pack for PRs / manual runs (unsigned, not uploaded) ---

      - name: Pack (validation, unsigned)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: >
          vpk pack
          --packId GloamApp
          --packVersion ${{ steps.ver.outputs.version }}
          --packDir publish
          --mainExe Gloam.exe
          --packTitle Gloam
          --packAuthors "mentho7"
          --icon src/Gloam/app.ico

      - name: Upload build artifacts
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v7
        with:
          name: Gloam_Velopack
          path: Releases/*
